name: Build Ardour 9.8 Windows x64

on:
  push:
    branches:
      - build/ardour-9.8-win64
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 180

    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Initialize MSVC 2026
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify toolchain
        shell: pwsh
        run: |
          python --version
          git --version
          llvm-nm --version
          cl 2>&1 | Select-Object -First 3

      - name: Install xmake development build
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          & ([ScriptBlock]::Create((Invoke-RestMethod https://xmake.io/psget.text))) -version dev
          $xmake = Get-Command xmake.exe -ErrorAction SilentlyContinue
          if (-not $xmake) {
            $xmake = Get-ChildItem $env:USERPROFILE -Filter xmake.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $xmake) { throw 'xmake.exe not found after installation' }
          (Split-Path $xmake.Source) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $xmake.Source --version

      - name: Prepare dependency recipe
        shell: pwsh
        run: |
          $stack = Join-Path $env:USERPROFILE 'src\stack'
          New-Item -ItemType Directory -Force -Path $stack | Out-Null
          @'
          set_policy("package.sync_requires_to_deps", true)
          if is_mode("debug") then
              add_requireconfs("**", {configs = {debug = true, shared = true}, system = false, build = true})
          else
              add_requireconfs("**", {configs = {shared = true}, system = false, build = true})
          end

          add_requires("libcurl")
          add_requires("boost")
          add_requires("libsndfile")
          add_requires("libarchive")
          add_requires("liblo")
          add_requires("taglib")
          add_requires("vamp-plugin-sdk")
          add_requires("libusb")
          add_requires("rubberband")
          add_requires("jack2")
          add_requires("fftw")
          add_requires("aubio")
          add_requires("libxml2")
          add_requires("cppunit")
          add_requires("libwebsockets")
          add_requires("portaudio", {configs = {asio = true}})
          add_requires("libsamplerate")
          add_requires("lilv")
          add_requires("libjpeg-turbo")
          add_requires("lrdf")
          add_requires("pangomm <2.48.0")
          if is_plat("windows") then
              add_requires("pthreads4w")
          end

          target("collect_deps")
          set_kind("phony")
          after_load(function()
              import("core.project.config")
              import("core.cache.localcache")
              local dest = path.join(os.projectdir(), config.mode() or "release")
              local subdirs = {"include", "lib"}
              if is_plat("windows") then table.insert(subdirs, "bin") end
              local skip = {python = true, cmake = true, ninja = true, meson = true, gperf = true}
              local function pkgname(installdir)
                  local parts = path.split(installdir)
                  return parts[#parts - 2]
              end
              local refs = localcache.cache("references")
              local pkgs = refs:get("packages") or {}
              os.mkdir(dest)
              for _, installdir in ipairs(pkgs) do
                  if not skip[pkgname(installdir)] then
                      for _, sub in ipairs(subdirs) do
                          local src = path.join(installdir, sub)
                          if sub == "lib" then
                              for _, fp in ipairs(os.files(path.join(src, "**"))) do
                                  local tgt = path.join(dest, sub, path.relative(fp, src))
                                  os.mkdir(path.directory(tgt))
                                  os.cp(fp, tgt)
                              end
                          elseif os.isdir(src) then
                              os.cp(src, dest)
                          end
                      end
                  end
              end
          end)
          '@ | Set-Content -Path (Join-Path $stack 'xmake.lua') -Encoding utf8

      - name: Build dependency stack
        shell: pwsh
        run: |
          $stack = Join-Path $env:USERPROFILE 'src\stack'
          Set-Location $stack
          xrepo update-repo
          xmake f -c -y
          xmake -y -vD
          if (-not (Test-Path (Join-Path $stack 'release\lib'))) { throw 'dependency stack not collected' }

      - name: Clone pinned Ardour 9.8 source
        shell: pwsh
        run: |
          $src = Join-Path $env:USERPROFILE 'src\ardour'
          git clone https://github.com/Ardour/ardour.git $src
          Set-Location $src
          git checkout 22ed8656c2533e325322ff11831448e5123e0d4b
          git submodule update --init --recursive
          git rev-parse HEAD

      - name: Configure and build Ardour
        shell: pwsh
        run: |
          $src = Join-Path $env:USERPROFILE 'src\ardour'
          $stack = Join-Path $env:USERPROFILE 'src\stack\release'
          $prefix = Join-Path $env:GITHUB_WORKSPACE 'ardour-install'
          $env:PATH = (Join-Path $stack 'bin') + ';' + $env:PATH
          $env:PKG_CONFIG_PATH = Join-Path $stack 'lib\pkgconfig'
          Set-Location $src
          python waf configure --prefix="$prefix" --configdir=share --ptformat --dist-target=msvc --cxx17 --optimize --also-include="$(Join-Path $stack 'include')" --also-libdir="$(Join-Path $stack 'lib')"
          python waf -j2
          python waf install

      - name: Package finished Windows build
        shell: pwsh
        run: |
          $install = Join-Path $env:GITHUB_WORKSPACE 'ardour-install'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'artifact\Ardour-9.8-Windows-x64'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $install '*') $stage -Recurse -Force

          $stackBin = Join-Path $env:USERPROFILE 'src\stack\release\bin'
          if (Test-Path $stackBin) {
            $targetBin = Join-Path $stage 'bin'
            New-Item -ItemType Directory -Force -Path $targetBin | Out-Null
            Copy-Item (Join-Path $stackBin '*.dll') $targetBin -Force -ErrorAction SilentlyContinue
          }

          $exe = Get-ChildItem $stage -Filter '*.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'No Windows executable found in installed Ardour tree' }

          $manifest = Get-ChildItem $stage -File -Recurse | ForEach-Object {
            [PSCustomObject]@{
              Path = $_.FullName.Substring($stage.Length + 1)
              SHA256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
              Size = $_.Length
            }
          }
          $manifest | ConvertTo-Json -Depth 3 | Set-Content (Join-Path $stage 'SHA256SUMS.json') -Encoding utf8
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'Ardour-9.8-Windows-x64.zip') -Force

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ardour-9.8-Windows-x64
          path: Ardour-9.8-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
